# The indexed diarization model is downloaded on first use. Run with either:
#   nemo-speech diarize meeting.wav --config config/diar.example.yaml
#   nemo-speech serve --config config/diar.example.yaml
diar:
  model_path: nvidia/diar_streaming_sortformer_4spk-v2
  preset: streaming              # streaming | offline (larger chunks and caches)
