# nemo-speech TTS config.
#
# Load with:
#   nemo-speech serve --config config/tts.example.yaml
#
# The nested maps mirror dotted config keys. For example, `tts.magpie-model`
# can also be set by env as `NEMO_SPEECH_TTS_MAGPIE_MODEL`.
#
# Precedence is: this file < NEMO_SPEECH_* env vars < CLI flags.
# Every key is optional, and omitted keys keep their built-in defaults. Unknown
# keys are a hard error so typos are not silently ignored.
tts:
  magpie-model: /models/magpie-tts/magpie_tts_multilingual_357m.v2602.f16.gguf
  codec-model: /models/nano-codec/nemo_nano_codec_22khz_1.89kbps_21.5fps.decoder.f16.gguf
  tokenizer-model-dir: /models/magpie-tts/extracted
  # tn-model-dir: /models/en_tn_grammars_cased   # written-form -> spoken-form TN

  language-code: en-US
  speaker: 0

  threads: 4
  codec-threads: 0              # 0 = use threads
  seed: -1                      # -1 = current time
  steps: -1                     # -1 = model default
  top-k: -1                     # -1 = model default
  # temperature: 0.6            # omitted = model default
  # cfg-scale: 2.5              # omitted = model default

  # Long-form only. batch-size decodes several text chunks in lockstep, which
  # is worth roughly 2x on a twenty-sentence script and costs memory, not
  # latency. It requires a fixed longform-history-tokens: the adaptive default
  # derives chunk N's text window from chunk N-1's alignment, which a wave has
  # not decoded yet. Set both or neither.
  # batch-size: 16
  # longform-history-tokens: 20   # -1 = adaptive (default), 0 = no history

  chunk-frames: 4
  codec-queue-depth: 4
  codec-history-frames: -1
  codec-future-frames: 1
  window-ms: 0
  flush-partial-chunk: true

  use-cfg: true
  use-local-transformer: true
  use-kv-cache: true
  use-stateful-codec: true
  codec-cpu: false

  lt-backend: auto              # auto | cpu | cuda
  sampling-backend: auto        # CUDA with a CUDA Magpie/LT path; otherwise CPU
  uma-mode: auto                # auto | off | on
  longform: auto                # auto | off | on

  # Server defaults and startup warmup:
  # voice-name: John
  # warmup-enabled: true
  # warmup-text: "Hello from Magpie T T S."
  # warmup-steps: 8
